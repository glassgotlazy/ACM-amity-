name: Weekly database backup

# Every Sunday at 03:00 IST, and on demand from the Actions tab.
on:
  schedule:
    - cron: "30 21 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_FILE: backup.json
        run: node scripts/backup.mjs
      # The backup holds applicants' personal details, and artifacts of a
      # public repository can be downloaded by anyone signed in to GitHub, so
      # it is only ever stored encrypted. Decrypt with:
      #   gpg --decrypt acm-backup.json.gpg > backup.json
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "Set the BACKUP_PASSPHRASE secret."; exit 1; fi
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o acm-backup.json.gpg backup.json
          shred -u backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: acm-backup-${{ github.run_number }}
          path: acm-backup.json.gpg
          retention-days: 90
